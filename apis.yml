aid: iolyx-therapeutics
name: Iolyx Therapeutics
description: >-
  Iolyx Therapeutics, Inc. is a privately held, clinical-stage biopharmaceutical company
  headquartered in Burlingame, California, working at what it calls the intersection of immunology
  and ophthalmology — "immuno-ophthalmology". The company develops immunomodulatory therapeutics
  that target ocular inflammation at its source, using what it describes as innovative pathways and
  tailored formulations for precise delivery to the relevant ocular tissues, positioned as an
  alternative to conventional steroids and broad immunosuppressants. Its lead asset, ILYX-002, is in
  trials for autoimmune-associated dry eye disease; the company announced Phase 2 results in May
  2025 and, in December 2025, a strategic agreement with Laboratoires Théa to develop and
  commercialize ILYX-002 alongside Series B funding for its retinal pipeline. The stated pipeline
  spans front-of-eye indications (dry eye, ocular allergy, rosacea, uveitis) and back-of-eye
  indications (age-related macular degeneration, diabetic retinopathy, posterior uveitis). Iolyx is a
  drug developer rather than a software vendor: it operates a six-page WordPress marketing site at
  iolyx.com and publishes no public API, developer portal, SDK, or machine-readable specification.
